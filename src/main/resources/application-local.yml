    # cdc-file-path: 'H:/HAEGroup/Systems Development/Tracking Redesign (Phase 1)/Tracking Rewrite (Phase 2)/Deployments/Sampath/Record Search/'    # [CDC_FILE_PATH]
  # scanned-document SFTP storage (ScanProperties)
  scan:
    encrypt-location: '/H:/Images/SCAN_DOCS/DEV/encrypt/'
