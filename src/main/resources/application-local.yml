    ehars-loader-to: 'sampath.anumolu@health.ny.gov,jyothsna.katari@health.ny.gov'
    record-search-upload-cc: sampath.anumolu@health.ny.gov
    error-notifications-to: sanjay.garg@health.ny.gov
    hiv-document-update-date-to: sampath.anumolu@health.ny.gov
  app:
    login-page: 'login/Login'
    logout-url: '/doh2/applinks/nyehms/web/login'
    by-pass: true
    load-schedulers: false
    load-schedulers-data-from-property: true
    environment-name: 'local WLS'
  # expected column layouts of uploaded files (UploadProperties)
  upload:
    cdc-return-column-names: 'stateno,cityno,last_name_sndx,dob,birth_sex,report_state_cd,stateno_x,cityno_x,last_name_sndx_x,dob_x,birth_sex_x,trans_categ,hiv_categ,hiv_dx_dt,rsh_state_cd,aids_categ,aids_dx_dt,rsa_state_cd,dod,rad_state_cd,death_state_cd,cur_state_cd,cur_address_dt,cd4cntpct_vl_recent_dt,care_nolab_dt,duplicate_status_warning'
