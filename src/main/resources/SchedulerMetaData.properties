ALLJARO_LIVE_SQL=select output from (select  pda.stateno,NVL((LPAD(pda.STATENO, 10, ' ')),'          ')  || NVL((LPAD (dpa.FIRST_NAME, 20, ' ')),'                    ')  || NVL((LPAD (dpa.LAST_NAME, 25, ' ')),'                         ') || NVL((LPAD (dpa.MIDDLE_NAME, 25, ' ')),'                         ')  || NVL((LPAD (dpa.SUFFIX, 5, ' ')),'     ') || NVL((LPAD (dpa.DOB_TEXT, 10, ' ')),'          ') || NVL((LPAD (dpa.SSN, 9, ' ')),'         ') || ' ' ||  NVL((LPAD (dpa.DOD_TEXT, 10, ' ')),'          ') || NVL((LPAD (dpa.MED_RECORD_NUMBER, 17, ' ')),'                 ') || NVL((LPAD (dpa.MEDICAID_NUMBER, 20, ' ')),'                    ') || NVL((LPAD (dpa.NYSID, 9, ' ')),'         ') || NVL((LPAD (dpa.DIN, 7, ' ')),'       ')  || NVL((LPAD (dpa.ADDRESS, 62, ' ')),'                                                              ') || NVL((LPAD (dpa.ADDRESS_CITY, 30, ' ')),'                              ')  || NVL((LPAD (dpa.ADDRESS_STATE, 2, ' ')),'  ') || NVL((LPAD (dpa.ADDRESS_ZIPCODE, 5, ' ')),'     ') || '    ' || '  ' || NVL((LPAD (dpa.ETHNICITY_CODE, 2, ' ')),'  ')  || NVL((LPAD (TO_CHAR(dpa.DATE_OF_BIRTH, 'MM/DD/YYYY') , 10, ' ')),'          ') || NVL((LPAD (dpa.GENDER_CODE, 1, ' ')),' ') || '                    '  || NVL((LPAD (dpa.DOCUMENT_ID, 20, ' ')),'                    ')AS output  , SUM(CASE WHEN  dpa.dod_text IS NULL THEN 0 ELSE 1 END ) OVER (PARTITION BY stateno )  dod_yn FROM document_person_attr dpa,  (select * from person_doc_association where rownum < 1000000) pda, document_locator dl   where dpa.document_id = pda.document_id   and pda.document_id = dl.document_id     and pda.dissassociation_date is null   and (is_active = 'Y' or is_active is null) and not exists (select 1 from nyehms_unmerging_statenos where stateno = pda.stateno and status_cd != 'REJECT')) a where a.dod_yn =0
ALLJARO_DEATH_SQL=select output from (select  pda.stateno,NVL((LPAD(pda.STATENO, 10, ' ')),'          ')  || NVL((LPAD (dpa.FIRST_NAME, 20, ' ')),'                    ')  || NVL((LPAD (dpa.LAST_NAME, 25, ' ')),'                         ') || NVL((LPAD (dpa.MIDDLE_NAME, 25, ' ')),'                         ')  || NVL((LPAD (dpa.SUFFIX, 5, ' ')),'     ') || NVL((LPAD (dpa.DOB_TEXT, 10, ' ')),'          ') || NVL((LPAD (dpa.SSN, 9, ' ')),'         ') || ' ' ||  NVL((LPAD (dpa.DOD_TEXT, 10, ' ')),'          ') || NVL((LPAD (dpa.MED_RECORD_NUMBER, 17, ' ')),'                 ') || NVL((LPAD (dpa.MEDICAID_NUMBER, 20, ' ')),'                    ') || NVL((LPAD (dpa.NYSID, 9, ' ')),'         ') || NVL((LPAD (dpa.DIN, 7, ' ')),'       ')  || NVL((LPAD (dpa.ADDRESS, 62, ' ')),'                                                              ') || NVL((LPAD (dpa.ADDRESS_CITY, 30, ' ')),'                              ')  || NVL((LPAD (dpa.ADDRESS_STATE, 2, ' ')),'  ') || NVL((LPAD (dpa.ADDRESS_ZIPCODE, 5, ' ')),'     ') || '    ' || '  ' || NVL((LPAD (dpa.ETHNICITY_CODE, 2, ' ')),'  ')  || NVL((LPAD (TO_CHAR(dpa.DATE_OF_BIRTH, 'MM/DD/YYYY') , 10, ' ')),'          ') || NVL((LPAD (dpa.GENDER_CODE, 1, ' ')),' ') || '                    '  || NVL((LPAD (dpa.DOCUMENT_ID, 20, ' ')),'                    ')AS output  , SUM(CASE WHEN  dpa.dod_text IS NULL THEN 0 ELSE 1 END ) OVER (PARTITION BY stateno )  dod_yn FROM document_person_attr dpa,  (select * from person_doc_association where rownum < 20000) pda, document_locator dl   where dpa.document_id = pda.document_id   and pda.document_id = dl.document_id     and pda.dissassociation_date is null   and (is_active = 'Y' or is_active is null) and not exists (select 1 from nyehms_unmerging_statenos where stateno = pda.stateno and status_cd != 'REJECT')) a where a.dod_yn !=0 and rownum < 1000
