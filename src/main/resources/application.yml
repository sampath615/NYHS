    acknowledgement-message: '<div id="acknowledgementMessage"><h4 id="confirmMessageContent" class="font12pt" style="color:InactiveCaptionText">Clicking ''Agree'' is an acknowledgment that the user, by accessing this system, is accepting responsibility for protecting privileged, confidential and/or protected health information (PHI) according to HIPAA, NYS Public Health Law and other federal and state privacy laws. The user shall not at this time or at any time in the future disclose information obtained from this system to any other person unless that person is legally authorized and has official reasons to obtain the information. The NYEHMS application maintains user search history; access to patient records are audited to ensure compliance with security and confidentiality standards.</h4><span  class="font12pt bold" style="color:InactiveCaptionText">While telecommuting, I agree to the following: </span><ul style="color:InactiveCaptionText"><li class="font12pt bold" >I will only access confidential HIV or STI information for legitimate public health purposes in accordance to the Confidentiality and Data Security protocol.</li><li class="font12pt bold">I will adhere to the procedures outlined in the attestation I signed and remotely access confidential HIV or STI information when/if physical security precautions are optimal.</li><li class="font12pt bold">I will not use VPN from any public environment (e.g., library, coffee shop, restaurant, train, airplane, temporary/unsecure co-working office space, etc..) where others could, intentionally or unwittingly, observe my screen. </li><li class="font12pt bold">I understand and agree that I am bound by these policies, even upon resignation, termination or completion of my activities.</li></ul></div>'
