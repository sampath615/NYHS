# Shared settings for all environments.
# Environment-specific values are in application-{local,dev,eval,prod}.yml;
# the active profile comes from -Dspring.profiles.active on each Tomcat.
# Everything app-specific lives under nyehms.* and is bound to the records in ...web.spring.config.

# ---------- Spring Boot ----------
spring:
  mvc:
    servlet:
      path: '/web'
    view:
      prefix: '/WEB-INF/jsp/'
      suffix: '.jsp'
  servlet:
    multipart:
      max-file-size: '409657600B'
      max-request-size: '409657600B'
  main:
    allow-circular-references: 'true'
  # SMTP server for all NYEHMS mail (was SendEmail.SMTP_HOST_NAME). Same in every environment.
  mail:
    host: 'mailhost.health.state.ny.us'
    properties:
      # as before: JavaMail protocol debug output to the console (Session.setDebug(true))
      mail.debug: 'true'
  # Jackson 3 set up to write JSON exactly like the Jackson 2 setup it replaced
  # (same property names, java.util.Date / Timestamp as epoch milliseconds). The pages expect this.
  jackson:
    use-jackson2-defaults: true
    datatype:
      datetime:
        write-dates-as-timestamps: true
  jpa:
    hibernate:
      ddl-auto: 'none'
    open-in-view: 'false'
    properties:
      hibernate:
        jdbc:
          fetch_size: '100'
logging:
  file:
    name: '/ctrlacc/logs/Applications/nyehms/application_devtcapp9.log'
  level:
    root: 'INFO'
  logback:
    rollingpolicy:
      max-file-size: '7680KB'
      total-size-cap: '40MB'
  pattern:
    file: '%d{"dd/MMM/yyyy HH:mm:ss,SSS"} %5p %c{0}:%L:%M - %m%n'
    console: '%d{"dd/MMM/yyyy HH:mm:ss,SSS"} %5p %c{0}:%L:%M - %m%n'

