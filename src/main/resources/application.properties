spring.mvc.servlet.path=/web
spring.servlet.multipart.max-file-size=409657600B
spring.servlet.multipart.max-request-size=409657600B

#spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Logging (Spring Boot default = Logback); same file and level as the old log4j2.xml
logging.file.name=/ctrlacc/logs/Applications/nyehms/application.log
logging.level.root=INFO
logging.logback.rollingpolicy.max-file-size=7680KB
logging.logback.rollingpolicy.total-size-cap=40MB
logging.pattern.file=%d{"dd/MMM/yyyy HH:mm:ss,SSS"} %5p %c{0}:%L:%M - %m%n
logging.pattern.console=%d{"dd/MMM/yyyy HH:mm:ss,SSS"} %5p %c{0}:%L:%M - %m%n
